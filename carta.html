<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta bonita · Con imagen</title>
  <!-- html2canvas para descargar como imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ===== RESETEO Y FONDO ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #f9e0d0 0%, #f3d1c0 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
      gap: 30px;
    }

    /* ===== CONTENEDOR DE LA CARTA ===== */
    #card-container {
      background: #fff8f0;
      padding: 40px 35px 45px 35px;
      border-radius: 40px 12px 40px 12px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.15),
        0 8px 20px rgba(0, 0, 0, 0.08),
        inset 0 -2px 6px rgba(255, 215, 180, 0.3);
      border: 1px solid rgba(255, 235, 215, 0.6);
      max-width: 620px;
      width: 100%;
      transition: transform 0.2s ease;
    }

    #card-container:hover {
      transform: scale(1.01);
      box-shadow: 0 28px 50px rgba(0, 0, 0, 0.18);
    }

    /* ===== ENCABEZADO ===== */
    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #eccfc2;
    }

    .stamp {
      background: #d4a393;
      color: #fffcf7;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 40px;
      box-shadow: inset 0 -3px 0 #b28270;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
    }

    .date {
      font-size: 0.95rem;
      color: #a78b7e;
      font-style: italic;
      background: #f7ede8;
      padding: 4px 14px;
      border-radius: 30px;
    }

    /* ===== CUERPO DE LA CARTA ===== */
    .letter-body {
      background: #fffdfb;
      padding: 30px 30px 25px 30px;
      border-radius: 30px 6px 30px 6px;
      box-shadow: 
        inset 0 2px 8px rgba(190, 140, 120, 0.08),
        0 6px 14px rgba(140, 90, 70, 0.08);
      border: 1px solid #f7ece4;
    }

    /* ===== IMAGEN CENTRAL ===== */
    .image-container {
      text-align: center;
      margin: 18px 0 22px 0;
      padding: 8px;
      background: #fcf5ef;
      border-radius: 24px 6px 24px 6px;
      border: 1px solid #f0dfd5;
      box-shadow: inset 0 2px 8px rgba(180, 140, 120, 0.06);
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      max-height: 280px;
      border-radius: 20px 4px 20px 4px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 6px 16px rgba(120, 80, 60, 0.15);
      transition: transform 0.3s ease;
      /* 📷 CAMBIA AQUÍ: puedes ajustar el ancho máximo */
      /* max-width: 80%; */ 
    }

    .image-container img:hover {
      transform: scale(1.02);
    }

    /* ===== TEXTO DE LA CARTA ===== */
    .greeting {
      font-size: 2.0rem;
      font-weight: 300;
      color: #6b4c3d;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .greeting span {
      background: #f7e3da;
      padding: 0 12px;
      border-radius: 40px;
      font-size: 1.6rem;
      line-height: 1.4;
    }

    .message {
      font-size: 1.2rem;
      line-height: 1.8;
      color: #3f2e26;
      margin-bottom: 24px;
      padding: 0 4px;
      text-align: left;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .message p {
      margin-bottom: 16px;
      text-indent: 2em;
    }

    .message p:last-of-type {
      margin-bottom: 8px;
    }

    .highlight {
      background: linear-gradient(120deg, #fbeadf 0%, #fbeadf 40%, transparent 80%);
      padding: 0 6px;
      font-weight: 500;
      color: #5a3e31;
      border-radius: 12px 0 0 12px;
    }

    .emoji-big {
      font-size: 1.5rem;
      display: inline-block;
      margin: 0 4px;
    }

    /* ===== FIRMA ===== */
    .signature {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #f0dfd5;
      gap: 12px;
      flex-wrap: wrap;
    }

    .heart-icon {
      font-size: 2.2rem;
      color: #c2725a;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(190, 90, 60, 0.2));
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .signature-name {
      font-size: 1.6rem;
      font-weight: 300;
      color: #5f4436;
      letter-spacing: 2px;
      background: #f4e7e0;
      padding: 0 18px 0 16px;
      border-radius: 40px;
      line-height: 1.6;
      font-family: 'Georgia', cursive;
      border: 1px solid #e3cdc1;
    }

    .signature-name small {
      font-size: 0.9rem;
      opacity: 0.7;
      font-weight: 200;
    }

    /* ===== PIE DE CARTA ===== */
    .letter-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.9rem;
      color: #b19587;
      letter-spacing: 1px;
      font-style: italic;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      border-top: 1px dashed #e6d3c8;
      padding-top: 18px;
    }

    .letter-footer span {
      background: #fcf3ed;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      color: #8a7063;
    }

    /* ===== BOTÓN DE DESCARGA ===== */
    .download-btn {
      background: #d4a393;
      border: none;
      padding: 14px 38px;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fffcf7;
      letter-spacing: 1.2px;
      box-shadow: 0 8px 18px rgba(150, 90, 70, 0.25);
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      border: 1px solid rgba(255, 235, 215, 0.4);
    }

    .download-btn:hover {
      background: #c28a78;
      transform: scale(1.03);
      box-shadow: 0 12px 24px rgba(130, 80, 60, 0.3);
    }

    .download-btn:active {
      transform: scale(0.96);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      #card-container {
        padding: 20px 18px 25px 18px;
      }
      .letter-body {
        padding: 20px 16px 20px 16px;
      }
      .greeting {
        font-size: 1.8rem;
        flex-wrap: wrap;
      }
      .message {
        font-size: 1.05rem;
      }
      .signature-name {
        font-size: 1.3rem;
      }
      .stamp {
        font-size: 0.7rem;
        padding: 4px 12px;
      }
      .date {
        font-size: 0.75rem;
        padding: 2px 12px;
      }
      .download-btn {
        padding: 12px 26px;
        font-size: 1rem;
        gap: 10px;
      }
      .image-container img {
        max-height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== CARTA ===== -->
  <div id="card-container">
    <div class="letter-header">
      <div class="stamp">✨ Para ti</div>
      <div class="date">🌷 2026 </div>
    </div>

    <div class="letter-body">
      <div class="greeting">
        <span>💌</span> Ardillita
      </div>

      <!-- ===== 📷 IMAGEN CENTRAL ===== -->
      <div class="image-container">
        <!-- 
          📷 CAMBIA AQUÍ: Reemplaza 'tu-imagen.jpg' con la URL o ruta de tu imagen
          
          Ejemplos:
          - Imagen de internet: src="https://ejemplo.com/flor.jpg"
          - Imagen local: src="mi-foto.jpg" (si está en la misma carpeta)
          - Imagen local en carpeta: src="imagenes/mi-foto.jpg"
        -->
          
        <img 
          src="pic.jpg" 
          alt="Imagen bonita para la carta"
          loading="lazy"
        >
      </div>

      <div class="message">
        
        <p>
          <span class="highlight">Gracias</span> por ser esa persona especial en mi vida. 
          <span class="emoji-big">✨✨</span>
        </p>
      </div>

      <div class="signature">
        <span class="heart-icon">❤️</span>
        <div class="signature-name">
          <small>con cariño,</small>  Toopher <small></small>
        </div>
      </div>
    </div>

    <div class="letter-footer">
      <span>🌿  De corazón  🌿</span>
      <span>✧  Un abrazo gigante  ✧</span>
    </div>
  </div>

</body>
</html>
